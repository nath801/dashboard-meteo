name: CI sécurité

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # chaque lundi : détecte les nouvelles CVE

permissions:
  contents: read

jobs:
  tests:
    name: Tests unitaires (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest-cov
      - name: Tests + rapports (JUnit XML, couverture)
        run: |
          mkdir -p rapport-tests
          pytest -v --junitxml=rapport-tests/junit.xml --cov=src --cov-report=term-missing \
            --cov-report=xml:rapport-tests/couverture.xml | tee rapport-tests/pytest_resultats.txt
          exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rapport-tests
          path: rapport-tests/
    name: Analyse statique (Bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit
      - name: Rapport HTML complet
        run: bandit -r src app.py -f html -o bandit.html || true
      - uses: actions/upload-artifact@v4
        with:
          name: rapport-bandit
          path: bandit.html
      - name: Échec si gravité moyenne ou haute
        run: bandit -r src app.py -ll

  dependances:
    name: Dépendances (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --desc

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Gitleaks en ligne de commande sur tout l'historique (l'action officielle échoue
      # au premier push : elle analyse « premier_commit^..dernier » alors que le commit initial n'a pas de parent).
      - name: Gitleaks (historique complet)
        run: |
          docker run --rm -u "$(id -u):$(id -g)" -v "$PWD:/repo" -w /repo             zricethezav/gitleaks:latest git . --redact --verbose --exit-code 1

  dast:
    name: Scan dynamique (OWASP ZAP via Caddy HTTPS)
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Lancer Streamlit
        run: nohup python -m streamlit run app.py > streamlit.log 2>&1 &
      - name: Lancer Caddy (HTTPS + en-têtes de sécurité)
        run: |
          curl -sSL "https://caddyserver.com/api/download?os=linux&arch=amd64" -o caddy
          chmod +x caddy
          nohup ./caddy run --config Caddyfile --adapter caddyfile > caddy.log 2>&1 &
      - name: Attendre que l'application réponde
        run: |
          for i in $(seq 1 60); do
            curl -skf https://localhost:8443/_stcore/health && exit 0
            sleep 2
          done
          cat streamlit.log caddy.log
          exit 1
      - name: OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: https://localhost:8443
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a"
          allow_issue_writing: false
          artifact_name: rapport-zap
